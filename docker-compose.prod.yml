  #     - DEFAULT_FROM_EMAIL=${N8N_SMTP_SENDER}
  #     - SERVER_EMAIL=${N8N_SMTP_SENDER}
  #     - DEBUG_CSRF=True
  #     - BEHIND_HTTPS_PROXY=True
  #   restart: always
  #   labels:
  #     - "traefik.enable=true"
